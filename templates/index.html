<!DOCTYPE html>
<html lang="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
  <meta charset="UTF-8" />
  <title>Cattle Lameness Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f0f8ff, #e6f2ff);
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-family: 'Roboto Slab', serif;
      font-size: 3em;
      font-weight: bold;
      margin-top: 30px;
      color: #003366;
    }
    .section {
      background: #ffffffdd;
      padding: 30px 50px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin: 20px 0;
      width: 400px;
    }
    button, input[type="submit"] {
      background: #0066cc;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color .3s;
      margin-top: 10px;
    }
    button:hover, input[type="submit"]:hover {
      background: #004d99;
    }
    input[type="file"] { margin-top: 10px; }
    video, img { margin-top: 15px; width: 100%; border-radius: 10px; }
    #result { font-size: 1.2em; margin-top: 10px; color: #003366; }

    @media (max-width: 600px) {
  .section {
    width: 90%;
    padding: 20px;
  }

  video, img, canvas {
    width: 100% !important;
    height: auto !important;
  }

  h1 {
    font-size: 2em;
  }
}

  </style>
</head>
<body>

<h1>Cattle Lameness Detection System</h1>

<div class="section">
  <h2>Live Detection from Webcam</h2>
  <button onclick="startDetection()">Start Real-Time Detection</button>
  <video id="video" width="640" height="480" autoplay muted style="display:none;"></video>
  <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
  <img id="processedFrame" src="" alt="Processed Frame" style="display:none;" />
  <div id="result">Click the button above to start detection.</div>
</div>

<div class="section">
  <h2>Upload a Video</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="video/*" required><br>
    <input type="submit" value="Upload and Analyze">
  </form>
</div>

<div class="section">
  <h2>Analyze and Plot</h2>
  <a href="/plot"><button>Go to Plot Page</button></a>
</div>

<footer style="text-align:center; padding:10px; background-color:#f1f1f1;">
  &copy; 2025 Eswar Reddy Boyi. All rights reserved.
</footer>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const resultDiv = document.getElementById('result');
  const processedFrame = document.getElementById('processedFrame');
  const ctx = canvas.getContext('2d');
  const fps = 5;

  function startDetection() {
    video.style.display = 'none';
    canvas.style.display = 'none';
    processedFrame.style.display = 'block';
    resultDiv.textContent = "Starting webcam...";

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
        video.play();
        setInterval(sendFrame, 1000 / fps);
      })
      .catch(err => resultDiv.textContent = 'Webcam access denied.');
  }

  function sendFrame() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/jpeg');
    fetch('/process_frame', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageData })
    })
    .then(res => res.json())
    .then(data => {
      processedFrame.src = data.frame;
      resultDiv.textContent = data.result || 'Detection running...';
    })
    .catch(err => {
      resultDiv.textContent = 'Error processing frame.';
      console.error(err);
    });
  }
</script>

</body>
</html>
